# =====================================================================
#  rules.yaml  --  how significant is an event WITHIN its own sport?
# =====================================================================
#
#  Scores run 0 to 10 and are always judged against the sport itself,
#  never across sports. Comparing sports is what interests.yaml is for.
#  So the Wimbledon final is a 10 here even if you rate tennis a 2.
#
#  Each event is scored in three layers, then clamped to 0..10:
#
#      significance = base + stage adjustment + context adjustments
#
#    1. BASE     One number per competition. Read it as: how big is an
#                ORDINARY fixture in this competition? A normal midweek
#                one, not the final.
#
#    2. STAGE    Where in the competition this fixture sits. Finals go
#                up, group games and qualifiers go down. Sports with a
#                different shape define their own `stages` block.
#
#    3. CONTEXT  Flags for what a flat table gets wrong: a title
#                decider, a derby, a dead rubber.
#
#  Worked examples, all football:
#      FIFA World Cup      8  + final    +2  = 10
#      Champions League    7  + group    -1  =  6
#      Premier League      6  + derby    +1  =  7
#      TFF 3. Lig          1  + regular   0  =  1
#
#  HOW TO EDIT
#    * Change any number. Whole numbers only.
#    * Add a competition by adding a line under the right sport.
#    * Competition names are matched against whatever the data source
#      calls the event, case-insensitively, longest match wins. If your
#      feed spells something differently, add that spelling as its own
#      line with the same score. Both spellings can coexist.
#    * A competition the app has never seen scores
#      `defaults.unknown_competition` and is listed at the foot of the
#      report, so this table grows through use instead of needing to be
#      complete today.
#
#  Every number below is my first guess. Argue with them.
# =====================================================================


defaults:
  unknown_competition: 1
  min_score: 0
  max_score: 10


# Used by every sport that does not define its own `stages` block.
default_stages:
  final: +2
  third-place: 0
  semi-final: +1
  quarter-final: 0
  round-of-16: -1
  group: -1
  round-robin: -1
  regular-season: 0
  playoff: +1
  qualifying: -3
  friendly: -3


# Applied to every sport. The app raises a flag only when it can work it
# out from the data. Flags it cannot determine are never applied, so
# these only ever help.
context:
  title-decider: +2
  trophy-decider: +2
  promotion-decider: +1
  relegation-decider: +1
  derby: +1
  # Teams and athletes you named in interests.yaml.
  favourite: +2
  record-attempt: +1
  dead-rubber: -2
  exhibition: -3
  youth-or-reserve: -3


